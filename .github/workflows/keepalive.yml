name: keep-alive

# Каждые 5 минут обращается к сайту, чтобы бесплатный Render не засыпал.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:   # можно запустить руками во вкладке Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping service
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://cashflow-mv1d.onrender.com/ping
